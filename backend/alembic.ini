# Alembic configuration for the Vecton AI backend.
#
# The database URL is NOT set here - migrations/env.py pulls it from
# app.core.config.settings.DATABASE_URL (i.e. your backend/.env file), so the
# connection string never lands in version control.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timezone for the Create Date stamp in generated migration files.
# timezone =

[post_write_hooks]
# (none configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
